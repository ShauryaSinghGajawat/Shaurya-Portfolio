<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project — Aditya Singh</title>
  <meta name="description" content="Detailed project page for Aditya's game environment portfolio." />
  <link rel="stylesheet" href="style.css" />
</head>

<body class="project-page">
  <div class="page">

    <!-- ================= HEADER ================= -->
    <header class="site-header glass">
      <div class="brand">
        <div class="logo">AS</div>
        <div class="brand-text">
          <h1>Shaurya Singh Gajawat</h1>
          <p>An aspiring game environment artist - Applicant for the DAE program - Game Graphics Production</p>
        </div>
      </div>

      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="index.html#gallery">Gallery</a>
        <a href="index.html#about">About</a>
        <a href="index.html#contact" class="nav-btn">Contact</a>
      </nav>
    </header>

    <!-- ================= PROJECT CONTENT ================= -->
    <main class="project-main">
      <a href="index.html#gallery" class="back-link">← Back to Gallery</a>

      <section class="project-section" id="project-root">
        <header class="project-header">
          <p class="project-kicker">Featured Arts</p>
          <h1 id="project-title">Loading...</h1>
        </header>

        <div class="project-layout">

          <!-- LEFT: Media column -->
          <div class="project-media-column">
            <div class="project-media-outer">
              <div class="project-media-inner">
                <div id="project-media-stack" class="project-media-stack">
                  <!-- JS injects images & videos here -->
                </div>
              </div>
            </div>
          </div>

          <!-- RIGHT: Sidebar -->
          <aside class="project-sidebar">

            <div class="project-tools glass" id="project-tools"></div>
            <div class="project-description glass" id="project-description"></div>
            <div class="project-breakdown glass" id="project-breakdown"></div>
            <section class="project-more-projects glass" id="project-more-projects"></section>
          </aside>

        </div>
      </section>
    </main>
  </div>

  <!-- ================= LIGHTBOX ================= -->
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="lightbox-close" aria-label="Close media viewer">×</button>
    <div class="lightbox-inner">
      <div class="lightbox-toolbar">
        <button class="lightbox-zoom-btn" data-zoom="out">−</button>
        <button class="lightbox-zoom-btn" data-zoom="in">+</button>
        <button class="lightbox-zoom-btn" data-zoom="reset">100%</button>
      </div>
      <div class="lightbox-media-wrapper">
        <img id="lightbox-img" alt="" />
        <video id="lightbox-video" controls playsinline></video>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <audio id="bg-music" preload="auto" loop muted>
  <source src="media/sounds/site-bgm.mp3" type="audio/mpeg">
</audio>
</body>
</html>
